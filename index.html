<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> 
<title>Bacheca Arrivi | Marina Porto Antico</title>

<link rel="manifest" href="manifest.json"> 
<meta name="theme-color" content="#0b3954">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --primary-color: #0b3954;
    --secondary-color: #087e8b;
    --bg-color: #f4f4f9;
    --text-color: #333;
    --card-bg: #ffffff;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 20px;
}

header {
    text-align: center;
    padding: 20px;
    background-color: var(--primary-color);
    color: white;
    border-radius: 8px;
    margin-bottom: 20px;
}

.container {
    display: flex;
    gap: 20px;
    max-width: 1250px;
    margin: 0 auto;
}

.form-section {
    flex: 1;
    background: white;
    padding: 20px;
    border-radius: 8px;
    height: fit-content;
}

.board-section {
    flex: 2;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.board-column {
    background: white;
    padding: 20px;
    border-radius: 8px;
    min-height: 180px;
}

h2 {
    margin-top: 0;
    color: var(--primary-color);
    border-bottom: 2px solid var(--secondary-color);
    padding-bottom: 10px;
}

.search-container {
    background: white;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.search-container label {
    margin-bottom: 0;
    white-space: nowrap;
}

.btn-export {
    background-color: #2c3e50;
    font-size: 14px;
    padding: 8px 12px;
    margin-bottom: 15px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}
.btn-export:hover { background-color: #34495e; }

details.archive-section {
    background: #eaeaea;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

details.archive-section summary {
    font-size: 1.5em;
    font-weight: bold;
    color: var(--primary-color);
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    border-bottom: 2px solid #ccc;
    padding-bottom: 10px;
    outline: none;
}

details.archive-section summary::before {
    content: "▶";
    font-size: 0.7em;
    margin-right: 10px;
    color: var(--secondary-color);
    transition: transform 0.2s;
}

details[open].archive-section summary::before {
    transform: rotate(90deg);
}

.archive-scroll {
    max-height: 600px;
    overflow-y: auto;
    margin-top: 15px;
    padding-right: 5px;
}

.archive-year-block {
    margin-bottom: 25px;
    background: #f5f5f5;
    padding: 15px;
    border-radius: 6px;
    border-left: 4px solid var(--primary-color);
}

.archive-year-title {
    margin: 0 0 15px 0;
    color: var(--primary-color);
    font-size: 1.2em;
    font-weight: bold;
}

.form-group {
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    color: var(--primary-color);
}

input, select, textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 16px;
    font-family: inherit;
}

textarea { resize: vertical; }

button {
    border: none;
    border-radius: 6px;
    padding: 11px 14px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    background: var(--secondary-color);
    color: white;
}

button:hover { opacity: 0.9; }

.main-btn {
    width: 100%;
    margin-top: 5px;
}
.main-btn.edit-mode {
    background-color: #d35400;
}

.boat-card {
    background: #fff;
    border-left: 5px solid var(--secondary-color);
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    display: flex;
    justify-content: space-between;
    gap: 15px;
}

.boat-card.arrived {
    border-left-color: #27ae60;
    background: #f7fff9;
}

.boat-card.archived {
    border-left-color: #7f8c8d;
    background: #fafafa;
    opacity: 0.9;
}

.boat-info h3 {
    margin: 0;
    color: var(--primary-color);
}

.boat-model {
    margin: 2px 0 8px 0;
    font-size: 14px;
    color: #666;
    font-weight: 500;
}

.boat-info p {
    margin: 3px 0;
    color: #555;
    font-size: 14px;
}

.date-badge {
    display: inline-block;
    background-color: #eaf7f8;
    color: #087e8b;
    padding: 6px 12px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 15px;
    margin: 8px 0;
    border: 1px solid #bce4e6;
}

.boat-card.arrived .date-badge {
    background-color: #e8f8f5;
    color: #27ae60;
    border-color: #a3e4d7;
}

.boat-card.archived .date-badge {
    background-color: #f0f3f4;
    color: #7f8c8d;
    border-color: #d5dbdb;
}

.date-badge.late {
    background-color: #fde8e8;
    color: #c0392b;
    border-color: #e74c3c;
    font-weight: 900;
}

.boat-note {
    margin-top: 8px !important;
    padding-top: 8px;
    border-top: 1px dashed #ccc;
    font-style: italic;
    color: #444 !important;
}

.photo-gallery {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #eee;
}

.photo-preview {
    width: 65px;
    height: 65px;
    object-fit: cover;
    border-radius: 4px;
    border: 1px solid #ddd;
    cursor: pointer;
    transition: transform 0.2s;
}

.photo-preview:hover {
    transform: scale(1.05);
}

/* Pulsante per caricamento foto rapido dentro la card */
.btn-upload-inline {
    background-color: #087e8b;
    color: white;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    text-align: center;
}
.btn-upload-inline:hover { opacity: 0.9; }

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
}

.btn-arrived { background: #27ae60; }
.btn-archive { background: #f39c12; }
.btn-edit { background: #3498db; }

.status {
    max-width: 1250px;
    margin: 0 auto 15px auto;
    padding: 10px 14px;
    border-radius: 6px;
    background: #eaf7f8;
    color: #0b3954;
    font-weight: bold;
}

.empty-message {
    color: #777;
    font-style: italic;
}

.status.error {
    background: #fde8e8;
    color: #c0392b;
    border: 1px solid #e74c3c;
}

@media (max-width: 768px) {
    body { padding: 12px; }
    .container { flex-direction: column; }
    .boat-card { flex-direction: column; }
    .actions button, .actions .btn-upload-inline { width: 100%; justify-content: center; }
    .search-container { flex-direction: column; align-items: flex-start; }
    .search-container input { width: 100%; }
}
</style>
</head>

<body>

<header>
   <h1>Marina Porto Antico - Gestione Arrivi</h1>
</header>

<div class="status" id="connectionStatus">
   Connessione Supabase in corso...
</div>

<div class="container">

    <div class="form-section">
        <h2 id="formTitle">Nuovo Arrivo</h2>

        <form id="boatForm">
            <input type="hidden" id="editingBoatId" value="">

            <div class="form-group">
                <label for="boatName">Nome Barca</label>
                <input type="text" id="boatName" required placeholder="Es. Stella Polare">
            </div>

            <div class="form-group">
                <label for="boatModel">Cantiere / Modello</label>
                <input type="text" id="boatModel" placeholder="Es. Beneteau Oceanis 41 / Riva 38">
            </div>

            <div class="form-group">
                <label for="arrivalDate">Data di Arrivo</label>
                <input type="date" id="arrivalDate" required>
            </div>

            <div class="form-group">
                <label for="mooring">Ormeggio Previsto</label>
                <input type="text" id="mooring" required placeholder="Es. Molo A, Posto 12">
            </div>

            <div class="form-group">
                <label for="boatType">Tipo Barca</label>
                <select id="boatType" required>
                    <option value="">Seleziona</option>
                    <option value="Motore">Motore</option>
                    <option value="Vela">Vela</option>
                    <option value="Catamarano">Catamarano</option>
                </select>
            </div>

            <div class="form-group">
                <label for="boatLength">Lunghezza (metri)</label>
                <input type="number" id="boatLength" step="0.01" min="0" placeholder="Es. 12.50">
            </div>

            <div class="form-group">
                <label for="boatWidth">Larghezza (metri)</label>
                <input type="number" id="boatWidth" step="0.01" min="0" placeholder="Es. 4.20">
            </div>

            <div class="form-group">
                <label for="boatNotes">Note Operative</label>
                <textarea id="boatNotes" rows="3" placeholder="Es. Necessita di assistenza all'ormeggio col gommone..."></textarea>
            </div>

            <button class="main-btn" type="submit" id="submitBtn">Aggiungi in Bacheca</button>
            <button type="button" id="cancelEditBtn" style="width:100%; margin-top:8px; background:#7f8c8d; display:none;" onclick="cancelEdit()">Annulla Modifica</button>
        </form>
    </div>

    <div class="board-section">

        <div class="search-container">
            <label for="searchDate">🔍 Filtra per Data di Arrivo:</label>
            <input type="date" id="searchDate" onchange="filterByDate()" oninput="if(!this.value) filterByDate()">
        </div>

        <div class="board-column">
            <h2>1. Barche in Arrivo</h2>
            <div id="incomingList"></div>
        </div>

        <div class="board-column">
            <h2>2. Barche Arrivate / In Porto</h2>
            <div id="arrivedList"></div>
        </div>

        <details class="archive-section">
            <summary>3. Archivio Storico (Clicca per espandere)</summary>
            <div class="archive-scroll">
                <button class="btn-export" onclick="exportArchiveToCSV()">📥 Esporta Archivio in Excel (CSV)</button>
                <div id="archivedList"></div>
            </div>
        </details>

    </div>

</div>

<script>
const SUPABASE_URL = 'https://dxpuuibqngbpfepxaubn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_hM7hzWLEkPsLw4mlrbExZw_oi0TaTYc';

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let boats = [];
let filterDateValue = ""; 

const incomingList = document.getElementById('incomingList');
const arrivedList = document.getElementById('arrivedList');
const archivedList = document.getElementById('archivedList');
const connectionStatus = document.getElementById('connectionStatus');

function setStatus(message, isError = false) {
    connectionStatus.textContent = message; 
    if(isError) {
        connectionStatus.classList.add('error');
    } else {
        connectionStatus.classList.remove('error');
    }
}

function formatDate(dateString) {
    if (!dateString) return '-';
    return new Date(dateString).toLocaleDateString('it-IT', {
        day: '2-digit', month: '2-digit', year: 'numeric'
    });
}

function formatSize(length, width) {
    const l = length ? `${length} m` : '-';
    const w = width ? `${width} m` : '-';
    return `${l} x ${w}`;
}

function filterByDate() {
    filterDateValue = document.getElementById('searchDate').value;
    renderBoats();
}

async function fetchBoats() {
    try {
        const { data, error } = await client
            .from('boats')
            .select('*')
            .order('arrival_date', { ascending: true });

        if (error) {
            console.error('Errore Supabase DB:', error);
            setStatus("Errore database: " + error.message, true);
            return;
        }

        boats = data || [];
        setStatus("✅ Connesso. Dati aggiornati in tempo reale.");
        renderBoats();

    } catch (err) {
        console.error('Eccezione JS:', err);
        setStatus("❌ Errore critico di comunicazione con Supabase.", true);
    }
}

// Canale Realtime attivo
client
    .channel('realtime-boats')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'boats' }, () => {
        fetchBoats();
    })
    .subscribe();

// Gestione form standard (Solo Dati, senza foto)
document.getElementById('boatForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const boatId = document.getElementById('editingBoatId').value;
    const isEditMode = boatId !== "";
    
    setStatus(isEditMode ? "Aggiornamento in corso..." : "Salvataggio in corso...");

    try {
        const lengthVal = document.getElementById('boatLength').value;
        const widthVal = document.getElementById('boatWidth').value;

        const boatData = {
            name: document.getElementById('boatName').value,
            model: document.getElementById('boatModel').value,
            arrival_date: document.getElementById('arrivalDate').value,
            mooring: document.getElementById('mooring').value,
            type: document.getElementById('boatType').value,
            length: lengthVal ? parseFloat(lengthVal) : null,
            width: widthVal ? parseFloat(widthVal) : null,
            notes: document.getElementById('boatNotes').value
        };

        if (isEditMode) {
            const { error } = await client.from('boats').update(boatData).eq('id', boatId);
            if (error) throw error;
            cancelEdit(); 
        } else {
            boatData.status = 'incoming';
            boatData.photos = []; // Inizializza array vuoto per le foto
            const { error } = await client.from('boats').insert([boatData]);
            if (error) throw error;
            this.reset();
        }

        fetchBoats();
        
    } catch (err) {
        console.error('Errore:', err);
        setStatus("❌ Errore: " + err.message, true);
    }
});

// NUOVA FUNZIONE: CARICAMENTO FOTO IMMEDIATO DALLA CARD SULLA DESTRA
async function uploadPhotosInline(boatId, inputElement) {
    const files = inputElement.files;
    if (!files || files.length === 0) return;

    setStatus("Caricamento immagini in corso...");
    try {
        // Cerca la barca nell'array locale per recuperare eventuali foto già caricate in precedenza
        const targetBoat = boats.find(b => b.id === boatId);
        let currentPhotos = targetBoat && targetBoat.photos ? [...targetBoat.photos] : [];

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.floor(Math.random() * 1000)}.${fileExt}`;

            const { data: uploadData, error: uploadError } = await client.storage
                .from('boat-photos')
                .upload(fileName, file);

            if (uploadError) throw uploadError;

            const { data: urlData } = client.storage
                .from('boat-photos')
                .getPublicUrl(fileName);

            currentPhotos.push(urlData.publicUrl);
        }

        // Aggiorna istantaneamente la riga specifica sul DB di Supabase
        const { error: dbError } = await client
            .from('boats')
            .update({ photos: currentPhotos })
            .eq('id', boatId);

        if (dbError) throw dbError;

        setStatus("📷 Foto salvate con successo!");
        fetchBoats();

    } catch (err) {
        console.error("Errore caricamento foto:", err);
        setStatus("❌ Errore durante il salvataggio delle foto: " + err.message, true);
    }
}

function startEdit(id) {
    const boat = boats.find(b => b.id === id);
    if (!boat) return;

    document.getElementById('editingBoatId').value = boat.id;
    document.getElementById('boatName').value = boat.name;
    document.getElementById('boatModel').value = boat.model || '';
    document.getElementById('arrivalDate').value = boat.arrival_date;
    document.getElementById('mooring').value = boat.mooring;
    document.getElementById('boatType').value = boat.type;
    document.getElementById('boatLength').value = boat.length || '';
    document.getElementById('boatWidth').value = boat.width || '';
    document.getElementById('boatNotes').value = boat.notes || '';

    document.getElementById('formTitle').textContent = "✏️ Modifica Barca";
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.textContent = "Salva Modifiche";
    submitBtn.classList.add('edit-mode');
    document.getElementById('cancelEditBtn').style.display = "block";
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
    document.getElementById('boatForm').reset();
    document.getElementById('editingBoatId').value = "";
    document.getElementById('formTitle').textContent = "Nuovo Arrivo";
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.textContent = "Aggiungi in Bacheca";
    submitBtn.classList.remove('edit-mode');
    document.getElementById('cancelEditBtn').style.display = "none";
}

async function markAsArrived(id) {
    setStatus("Aggiornamento stato (In Porto)...");
    try {
        const { error } = await client.from('boats').update({ status: 'arrived' }).eq('id', id);
        if (error) throw error;
        fetchBoats();
    } catch (err) {
        setStatus("❌ Errore nell'aggiornamento.", true);
    }
}

async function archiveBoat(id) {
    setStatus("Archiviazione pratica in corso...");
    try {
        const { error } = await client.from('boats').update({ status: 'archived' }).eq('id', id);
        if (error) throw error;
        fetchBoats();
    } catch (err) {
        setStatus("❌ Errore durante l'archiviazione.", true);
    }
}

function exportArchiveToCSV() {
    const archivedBoats = boats.filter(b => b.status === 'archived');
    if (archivedBoats.length === 0) {
        alert("L'archivio è vuoto. Non ci sono dati da esportare.");
        return;
    }

    let csvContent = "\uFEFFNome Barca;Cantiere-Modello;Data Arrivo;Ormeggio;Tipo;Lunghezza (m);Larghezza (m);Note;Link Foto\n";

    archivedBoats.forEach(b => {
        const name = b.name.replace(/;/g, ",");
        const model = (b.model || '').replace(/;/g, ",");
        const date = formatDate(b.arrival_date);
        const mooring = b.mooring.replace(/;/g, ",");
        const type = b.type;
        const length = b.length || '-';
        const width = b.width || '-';
        const notes = (b.notes || '').replace(/[\n\r;]/g, " ");
        const photosLinks = (b.photos || []).join(" | ");

        csvContent += `${name};${model};${date};${mooring};${type};${length};${width};${notes};${photosLinks}\n`;
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", `Archivio_Arrivi_Marina_Porto_Antico.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

function renderBoats() {
    incomingList.innerHTML = '';
    arrivedList.innerHTML = '';
    archivedList.innerHTML = '';

    let filteredBoats = boats;
    if (filterDateValue) {
        filteredBoats = boats.filter(b => b.arrival_date === filterDateValue);
    }

    const incoming = filteredBoats.filter(b => b.status === 'incoming');
    const arrived = filteredBoats.filter(b => b.status === 'arrived');
    const archived = filteredBoats.filter(b => b.status === 'archived');

    const createCard = (boat) => {
        const card = document.createElement('div');
        card.className = `boat-card ${boat.status}`;
        
        let isLate = false;
        if (boat.status === 'incoming' && boat.arrival_date) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const [year, month, day] = boat.arrival_date.split('-');
            const arrival = new Date(year, month - 1, day);
            
            if (arrival < today) isLate = true;
        }

        let cardHTML = `
            <div class="boat-info">
                <h3>${boat.name} <span style="font-size: 14px; font-weight: normal; color: #555;">(${boat.type || 'N/D'})</span></h3>
                <div class="boat-model">${boat.model ? boat.model : 'Modello non specificato'}</div>
                
                <div class="date-badge ${isLate ? 'late' : ''}">
                    📅 Arrivo: ${formatDate(boat.arrival_date)} ${isLate ? ' ⚠️ IN RITARDO' : ''}
                </div>
                
                <p><strong>Ormeggio:</strong> ${boat.mooring}</p>
                <p><strong>Dimensioni:</strong> ${formatSize(boat.length, boat.width)}</p>
        `;
        
        if (boat.notes && boat.notes.trim() !== '') {
            const formattedNotes = boat.notes.replace(/\n/g, '<br>');
            cardHTML += `<p class="boat-note"><strong>Note:</strong><br>${formattedNotes}</p>`;
        }

        // Visualizzazione della galleria fotografica (se presente)
        if (boat.photos && boat.photos.length > 0) {
            cardHTML += `<div class="photo-gallery">`;
            boat.photos.forEach(photoUrl => {
                cardHTML += `
                    <a href="${photoUrl}" target="_blank">
                        <img src="${photoUrl}" class="photo-preview" alt="Foto ormeggio">
                    </a>`;
            });
            cardHTML += `</div>`;
        }

        cardHTML += `
            </div>
            <div class="actions">
                ${boat.status === 'incoming' ? `
                    <button class="btn-edit" onclick="startEdit('${boat.id}')">✏️ Modifica</button>
                    <button class="btn-arrived" onclick="markAsArrived('${boat.id}')">✓ Arrivata</button>
                ` : ''}
                
                ${boat.status === 'arrived' ? `
                    <label class="btn-upload-inline">
                        📷 Aggiungi Foto
                        <input type="file" accept="image/*" multiple style="display: none;" onchange="uploadPhotosInline('${boat.id}', this)">
                    </label>
                    <button class="btn-archive" onclick="archiveBoat('${boat.id}')">📁 Archivia</button>
                ` : ''}
                
                ${boat.status === 'archived' ? `<span style="color: #7f8c8d; font-size: 13px; font-weight: bold;">Archiviata</span>` : ''}
            </div>
        `;
        
        card.innerHTML = cardHTML;
        return card;
    };

    incoming.forEach(boat => incomingList.appendChild(createCard(boat)));
    arrived.forEach(boat => arrivedList.appendChild(createCard(boat)));

    if (archived.length === 0) {
        archivedList.innerHTML = '<p class="empty-message">Nessun record corrispondente in archivio.</p>';
    } else {
        const yearsGroup = {};
        archived.forEach(boat => {
            const year = new Date(boat.arrival_date).getFullYear();
            if (!yearsGroup[year]) yearsGroup[year] = [];
            yearsGroup[year].push(boat);
        });

        const sortedYears = Object.keys(yearsGroup).sort((a, b) => b - a);

        sortedYears.forEach(year => {
            const yearBlock = document.createElement('div');
